name: Release

# Push a tag such as v0.1.0-preview.1 to publish.
# Uses NuGet Trusted Publishing (OIDC): no long-lived API key is stored in the repository.
# Requires a Trusted Publishing policy on nuget.org for this repository and workflow file
# (release.yml), and the NUGET_USER repository secret set to the nuget.org profile name.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets GitHub issue the OIDC token that NuGet/login exchanges
      contents: write   # creates the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet run -c Release --no-build --project tests/TokenLedger.Tests
      - run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts

      # The temporary API key lives for one hour, so log in right before pushing.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # A GitHub release with this version's section of CHANGELOG.md as its notes, and the packages attached.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$VERSION" --notes-file release-notes.md $prerelease
